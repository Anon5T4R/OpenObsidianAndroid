name: Release

# Dispara ao empurrar uma tag vX.Y.Z (a tag deve bater com o versionName do app).
# workflow_dispatch builda o APK assinado como artifact, sem criar Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Reconstrói a keystore e o keystore.properties a partir de 2 Secrets:
      #   KEYSTORE_B64            = base64 do openobsidian-release.jks
      #   KEYSTORE_PROPERTIES_B64 = base64 do seu keystore.properties (senhas já corretas)
      # Assim as senhas não são redigitadas — vêm do arquivo que já funciona local.
      # A linha storeFile é forçada para o nome do .jks recriado aqui (evita path
      # absoluto de Windows que não existe no runner Linux).
      # A chave precisa ser a MESMA das releases anteriores, senão o APK não
      # instala por cima da versão publicada.
      - name: Restaurar keystore de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES_B64: ${{ secrets.KEYSTORE_PROPERTIES_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PROPERTIES_B64" ]; then
            echo "::error::Faltam os Secrets KEYSTORE_B64 e/ou KEYSTORE_PROPERTIES_B64. Cadastre em Settings → Secrets and variables → Actions e rode de novo."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > openobsidian-release.jks
          echo "$KEYSTORE_PROPERTIES_B64" | base64 -d | grep -v '^storeFile=' > keystore.properties
          echo "storeFile=openobsidian-release.jks" >> keystore.properties

      # Diagnóstico temporário: confirma tipo da keystore e se store/key password
      # abrem. Só imprime OK/FALHOU — nunca as senhas. Remover quando resolvido.
      - name: Diagnóstico da keystore
        run: |
          SP=$(grep '^storePassword=' keystore.properties | cut -d'=' -f2-)
          KP=$(grep '^keyPassword=' keystore.properties | cut -d'=' -f2-)
          AL=$(grep '^keyAlias=' keystore.properties | cut -d'=' -f2-)
          echo "alias configurado: $AL"
          echo "== tipo e entradas da keystore (com store password) =="
          keytool -list -v -keystore openobsidian-release.jks -storepass "$SP" 2>/dev/null \
            | grep -iE "Keystore type|Alias name|Entry type|Certificate fingerprints" || echo "  (store password não abriu a keystore)"
          echo "== store password =="
          keytool -list -keystore openobsidian-release.jks -storepass "$SP" >/dev/null 2>&1 \
            && echo "  STORE PASSWORD OK" || echo "  STORE PASSWORD FALHOU"
          echo "== key password (valida via -certreq) =="
          keytool -certreq -alias "$AL" -keystore openobsidian-release.jks -storepass "$SP" -keypass "$KP" -dname "CN=diag" >/dev/null 2>&1 \
            && echo "  KEY PASSWORD OK" || echo "  KEY PASSWORD FALHOU"

      - name: Build release APK (assinado)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Renomear APK com a tag
        run: |
          mkdir -p out
          NAME="${GITHUB_REF_NAME:-manual}"
          cp app/build/outputs/apk/release/app-release.apk "out/OpenObsidian-${NAME}.apk"

      - name: Upload do artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: out/*.apk
          if-no-files-found: error

      # Só publica Release quando o gatilho é uma tag.
      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
